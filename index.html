<style>
:root{color-scheme:dark;
  --bg:#111110;--surface:#1a1a19;--surface-2:#222220;--border:#2f2f2c;--text:#f0efec;--text-2:#c3c2b7;--muted:#8f8e86;
  --accent:#3987e5;--grid:#2c2c2a;--empty:#262624;
  --crit:#e5484d;--high:#ec835a;--med:#f5b01a;--low:#5598e7;--none:#77766f;--good:#0ca30c;
  --crit-bg:rgba(229,72,77,.16);--high-bg:rgba(236,131,90,.16);--med-bg:rgba(245,176,26,.14);--low-bg:rgba(85,152,231,.16);--none-bg:rgba(119,118,111,.18)}
:root[data-theme="light"]{color-scheme:light;
  --bg:#f3f3f0;--surface:#fcfcfb;--surface-2:#f0efec;--border:#dddcd6;--text:#0b0b0b;--text-2:#52514e;--muted:#6f6e68;
  --accent:#2a78d6;--grid:#e8e7e2;--empty:#ecebe6;
  --crit:#c62a2f;--high:#d1582a;--med:#a66a00;--low:#256abf;--none:#77766f;
  --crit-bg:rgba(198,42,47,.10);--high-bg:rgba(209,88,42,.10);--med-bg:rgba(166,106,0,.10);--low-bg:rgba(37,106,191,.10);--none-bg:rgba(119,118,111,.12)}
*{box-sizing:border-box}[hidden]{display:none!important}
html,body{margin:0;background:var(--bg);color:var(--text);font:14px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
a{color:var(--accent)}
button,select,input,textarea{font:inherit;color:var(--text);background:var(--surface-2);border:1px solid var(--border);border-radius:8px;padding:6px 10px}
button{cursor:pointer}button:hover{border-color:var(--accent)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
header{position:sticky;top:0;z-index:20;background:var(--bg);border-bottom:1px solid var(--border)}
.bar{display:flex;align-items:center;gap:12px;padding:10px 18px;flex-wrap:wrap}
.brand{font-weight:700;font-size:17px}.brand small{display:block;font-weight:400;font-size:12px;color:var(--muted)}
.spacer{flex:1}
.switch{display:inline-flex;background:var(--surface-2);border:1px solid var(--border);border-radius:999px;padding:3px}
.switch button{border:0;background:transparent;border-radius:999px;padding:7px 22px;font-weight:650;letter-spacing:.4px;color:var(--text-2)}
.switch button.on{background:var(--accent);color:#fff}
.switch button small{font-weight:400;opacity:.85;margin-left:6px}
.pill{max-width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--text-2);background:var(--surface);border:1px solid var(--border);border-radius:999px;padding:3px 10px}
.dot{width:8px;height:8px;border-radius:50%;background:var(--muted)}.dot.ok{background:var(--good)}.dot.busy{background:var(--med)}.dot.err{background:var(--crit)}
nav{display:flex;gap:2px;padding:0 12px;overflow-x:auto}
nav a{padding:9px 12px;color:var(--text-2);text-decoration:none;border-bottom:2px solid transparent;white-space:nowrap}
nav a.on{color:var(--text);border-color:var(--accent)}
.filters{position:sticky;top:var(--hdr,104px);z-index:15;display:flex;gap:8px 10px;flex-wrap:wrap;align-items:center;overflow-x:hidden;padding:10px 18px;background:var(--surface);border-bottom:1px solid var(--border)}
.chip{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:4px 11px;font-size:12.5px;border:1px solid var(--border);background:var(--surface-2);color:var(--text-2);cursor:pointer;user-select:none;white-space:nowrap}
.chip b{font-variant-numeric:tabular-nums;color:var(--text)}

function matchQ(r){ if(!F.q) return true; const q=F.q.toLowerCase(); return r.txt.includes(q)||(r.actor||'').includes(q)||cname(r.cc).toLowerCase().includes(q); }
function matchShow(r){ switch(F.show){ case 'new': return isNew(r); case 'flag': return r.own||r.watch; case 'impact': return r.impact; case 'unsent': return !lastSent(r.id); case 'sent': return !!lastSent(r.id); default: return true; } }
function filtered(skip=''){
  return base().filter(r=>(skip==='ind'||inScope(r))&&(skip==='rel'||F.rel.includes(r.prio))&&(skip==='type'||F.types.includes(r.type))
    &&(skip==='zone'||!F.zone||zoneOf(r,F.grp)===F.zone)&&(skip==='country'||!F.country||r.cc===F.country)&&matchShow(r)&&matchQ(r));
}
const SORTS={seen:(a,b)=>b.seenMs-a.seenMs||b.tMs-a.tMs, event:(a,b)=>b.tMs-a.tMs, rel:(a,b)=>a.prio-b.prio||b.seenMs-a.seenMs};

/* ---------- filter bar ---------- */
function populate(){
  $('#fPeriod').value=F.period; $('#fGrp').value=F.grp;
  const zs=zoneList(F.grp); if(F.zone&&!zs.includes(F.zone)) F.zone='';
  $('#fZoneLbl').textContent=F.grp==='world'?'World region':'Lactalis zone';
  const b=base(); const zc={}; b.forEach(r=>{ const z=zoneOf(r,F.grp); zc[z]=(zc[z]||0)+1; });
  $('#fZone').innerHTML=`<option value="">${F.grp==='world'?'All regions':'All zones'}</option>`+zs.map(z=>`<option value="${z}">${esc(zoneLabel(z,F.grp))} (${fmtN(zc[z]||0)})</option>`).join('');
  $('#fZone').value=F.zone;
  const cc={}; b.filter(r=>!F.zone||zoneOf(r,F.grp)===F.zone).forEach(r=>{ if(r.cc) cc[r.cc]=(cc[r.cc]||0)+1; });
  if(F.country&&!cc[F.country]) cc[F.country]=0;
  $('#fCountry').innerHTML='<option value="">All countries</option>'+Object.keys(cc).sort((a,b)=>cname(a).localeCompare(cname(b))).map(c=>`<option value="${c}">${flag(c)} ${esc(cname(c))}${ZONE_OF[c]?' ·':''} (${fmtN(cc[c])})</option>`).join('');
  $('#fCountry').value=F.country; $('#fScope').value=F.show; $('#fQ').value=F.q;
  ['#fZone','#fCountry','#fScope'].forEach(s=>$(s).classList.toggle('active',!!$(s).value&&$(s).value!=='all'));
}

function detectScope(){ const eq=(a,b)=>a.length===b.length&&a.every(x=>b.includes(x)); return ['lactalis','supply','all'].find(s=>eq(F.ind,scopeSet(s)))||'custom'; }

$('#fZone').onchange=e=>{ F.zone=e.target.value; F.country=''; refresh(); };

/* ---------- status pill ---------- */
function status(){
  const d=$('#sDot'), t=$('#sTxt'); if(!d) return;
  if(busy){ d.className='dot busy'; t.textContent='Checking for new data…'; return; }
  if(!ALL.length){ d.className='dot '+(loadErr?'err':'busy'); t.textContent=loadErr?'Data unavailable':'Loading…'; return; }
  const built=lastBuilt?Date.parse(lastBuilt):0, nx=nextAt?Math.max(0,Math.round((nextAt-Date.now())/60000)):0;
  if(!SNAP()){ d.className='dot '+(loadErr?'err':Date.now()-built<45*60e3?'ok':'busy'); t.textContent=`Data ${rel(built)} · next check ${nx<1?'<1':nx} min`; t.parentElement.title=`Data built ${fmtDT(built)} (UTC ${lastBuilt}). The page re-checks every ${C.refreshMinutes} min.${loadErr?' Last error: '+loadErr:''}`; }
  else { d.className='dot '+(liveAt?'ok':'busy'); t.textContent=`Snapshot ${fmtD(built)}${liveAt?` + live claims ${rel(liveAt)}`:''}`; t.parentElement.title=`Embedded snapshot built ${fmtDT(built)}. ${liveAt?`Leak-site claims topped up live from GitHub mirrors (${liveN} new).`:liveErr?'Live top-up unavailable here: '+liveErr:'Live top-up pending.'} Press and regulatory sources need the GitHub Pages deployment.`; }
}

/* ---------- list rows ---------- */
const typeLabel=r=>TYPE_BY[r.type]?TYPE_BY[r.type].n:r.type;
const indTags=(r,max=3)=>{ const l=[...CORE.filter(k=>r.ind.has(k)),...SUP.filter(k=>r.ind.has(k)),...GEN.filter(k=>r.ind.has(k))]; if(l.includes('dairy')) l.splice(l.indexOf('food'),l.includes('food')?1:0);
  return l.slice(0,max).map(k=>`<span class="tag ind ${k==='dairy'?'dairy':IND_BY[k].g==='core'?'core':IND_BY[k].g==='sup'?'sup':''}">${esc(IND_BY[k].n)}</span>`).join(''); };
const indText=r=>{ const l=[...CORE,...SUP,...GEN].filter(k=>r.ind.has(k)); if(l.includes('dairy')&&l.includes('food')) l.splice(l.indexOf('food'),1); return l.map(k=>IND_BY[k].n).join(', '); };
const headline=r=>r.type==='claim'?r.title:(r.org&&r.type!=='news'?r.org:r.title);
function rowHTML(r,i){

  return `<div class="ir r${r.prio}${r.id===cur?' cur':''}" tabindex="0" data-i="${i}" data-id="${esc(r.id)}">

     <div>${r.own?'<span class="tag flag">Lactalis group</span>':''}${r.watch?'<span class="tag flag">Watchlist</span>':''}${r.impact?'<span class="tag imp">⚙ Operations impact</span>':''}${indTags(r)}${r.kinds.filter(k=>k!=='ransomware'||r.type!=='claim').slice(0,2).map(k=>`<span class="tag kind">${esc(k)}</span>`).join('')}</div></div>

}
function bindRows(el,rows){ el.querySelectorAll('.ir').forEach(n=>{ const r=rows[+n.dataset.i]; bindMail(n,r); const open=()=>{ cur=r.id; openIncident(r); }; n.onclick=open;

let limit=80, cur='', listRows=[];
const GKEY={none:null,zone:r=>zoneLabel(zoneOf(r,F.grp),F.grp),country:r=>`${flag(r.cc)} ${cname(r.cc)}`,industry:r=>indText(r).split(', ')[0]||'Other',day:r=>fmtD(r.seenMs),actor:r=>r.actor||'(no actor)',rel:r=>REL[r.prio].n};
const views={
 feed(){
  const rows=filtered().sort(SORTS[F.sort]||SORTS.seen); listRows=rows;
  const nNew=rows.filter(isNew).length, unsent=rows.filter(r=>!lastSent(r.id)&&r.prio<=2).length;

    <label class="small muted">Sort <select id="sSel" class="small"><option value="seen" ${F.sort==='seen'?'selected':''}>Newest detected</option><option value="event" ${F.sort==='event'?'selected':''}>Event date</option><option value="rel" ${F.sort==='rel'?'selected':''}>Relevance</option></select></label></div>`;

 },

function actions(r){ const l=[];

  l.push('Check whether this organisation is a supplier, customer, co-packer, logistics or IT partner of any Lactalis entity.');
  l.push('If it is: review and, if needed, restrict interconnections (VPN, EDI, APIs, shared accounts), and treat e-mails and invoices from its domain with extra care (phishing and payment-fraud risk).');
  if(r.type==='claim'||r.kinds.includes('ransomware')) l.push(`Confirm our detection covers the techniques of ${r.actor||'the group'}, and that the SOC watches for related indicators.`);
  if(r.impact) l.push('Check OT segmentation and the backup/restore readiness of comparable Lactalis plants.');

  try{ if('Notification' in window&&Notification.permission==='granted'){
    if(top.length>3){ const n=new Notification(`Incident Radar — ${top.length} new incidents`,{body:top.slice(0,4).map(r=>`[${REL[r.prio].n}] ${headline(r)} — ${cname(r.cc)}`).join('\n'),tag:'ir-batch'}); n.onclick=()=>{ focus(); F.show='new'; location.hash='#feed'; refresh(); }; }

}

function bindRecip(){
  document.querySelectorAll('.rlist').forEach(card=>{ const kind=card.dataset.kind, l=MAIL[kind], label=kind==='to'?'To':'Cc';

      if(a==='toggle'){ l[i].on=b.checked; commit(`${l[i].n||l[i].e} ${l[i].on?'activated':'deactivated'}`); }
      else if(a==='edit'){ recipEdit=kind+':'+i; views.alerts(); }

  $('#alLvl').onchange=e=>{ ALERT.level=+e.target.value; ls.set('ir.alert',ALERT); };
  $('#alScope').onchange=e=>{ ALERT.scopeOnly=e.target.checked; ls.set('ir.alert',ALERT); }; $('#alSnd').onchange=e=>{ ALERT.sound=e.target.checked; ls.set('ir.alert',ALERT); };
  $('#alTest').onclick=()=>{ const r=ALL.filter(x=>x.prio<=2).sort(SORTS.seen)[0]; if(!r) return toast('No incident to test with'); const was=ALERT.on; ALERT.on=true; notify([r]); NOTIFIED.delete(r.id); ALERT.on=was; };
  const c=$('#logCsv'); if(c) c.onclick=()=>{ const q=v=>`"${String(v??'').replace(/"/g,'""')}"`; const t=['when,incident,relevance,country,kind,method,to',...log.map(h=>{ const r=BYID.get(h.id); return [new Date(h.at).toISOString(),r?headline(r):h.id,r?REL[r.prio].n:'',r?cname(r.cc):'',h.kind,h.how,h.to].map(q).join(','); })].join('\n');
    navigator.clipboard.writeText(t).then(()=>toast('Send log copied as CSV'),()=>toast('Clipboard blocked')); };
};

/* ---------- sources ---------- */
const CAT={claims:'Leak-site claims',attacks:'Reported cyberattacks',regulatory:'Regulatory disclosures',press:'Cybersecurity press',trade:'Food & dairy trade press',aggregator:'News aggregator',gov:'Government CERTs'};
views.sources=function(){
  const S=(STATUS&&STATUS.sources)||{}, cnt={}; ALL.forEach(r=>r.srcs.forEach(s=>{ const k=s.k.replace(/^live_/,''); cnt[k]=(cnt[k]||0)+1; }));
  const keys=Object.keys(S), cats=[...new Set(keys.map(k=>S[k].cat))], ok=keys.filter(k=>S[k].ok), skip=keys.filter(k=>S[k].skipped), err=keys.filter(k=>!S[k].ok&&!S[k].skipped);
  const liveOn=!!liveAt||!!cwAt;
  const row=k=>{ const s=S[k]; return `<tr><td>${esc(s.name)}</td><td class="z">${esc(CAT[s.cat]||s.cat)}</td><td class="${s.ok?'ok':s.skipped?'skip':'err'}" title="${esc(s.error||'')}">${s.ok?'✓ collected':s.skipped?'deployment only':'✕ '+esc((s.error||'error').slice(0,60))}</td><td class="n">${s.ok?fmtN(s.rows):'—'}</td><td class="n">${fmtN(cnt[k]||0)}</td><td>${s.latest?esc(rel(Date.parse(s.latest))):'—'}</td></tr>`; };
  $('#view').innerHTML=`${SNAP()?`<div class="notice"><b>${ok.length} of ${keys.length} sources are in this copy; all ${keys.length} run in the GitHub deployment.</b> This snapshot was built in an environment whose internet access is limited to GitHub, so only the sources published on GitHub could be read: leak-site claims (ransomware.live mirror, ThreatCluster) and press-reported cyberattacks (Cyberwatch). The ${skip.length} others — ransomware.live API, SEC EDGAR, the press and trade feeds, Google News and the CERTs — are not blocked or broken: they run every 10 minutes once the bundle is deployed on GitHub Actions, which has open internet access.${liveOn?' The GitHub-hosted sources are also refreshed live by this page.':''}</div>`:''}
   <div class="card"><h3>Sources</h3><div class="sub">Data built ${esc(lastBuilt?fmtDT(Date.parse(lastBuilt)):'—')} · ${ok.length} collected${skip.length?` · ${skip.length} deployment only`:''}${err.length?` · ${err.length} failed`:''}${liveAt?` · live top-up ${esc(rel(liveAt))}`:''}</div>
   <table class="mtab"><thead><tr><th>Source</th><th>Category</th><th>Status</th><th style="text-align:right">Items read</th><th style="text-align:right">In dataset</th><th>Latest item</th></tr></thead><tbody>
   ${[...ok,...err,...skip].map(row).join('')}</tbody></table></div>
   <div class="grid g-2" style="margin-top:14px"><div class="card"><h3>Why these sources</h3><div class="small" style="line-height:1.6">
    <p><b>Leak-site claims</b> (ransomware.live, ThreatCluster) are usually the first public signal, often days before the victim speaks. They are criminal claims: unverified, sometimes exaggerated or recycled.</p>
    <p><b>Press-reported cyberattacks</b> (Cyberwatch, curated by Valéry Rieß-Marchive of LeMagIT from Google News searches in about 25 languages and checked by hand; the same data feeds ransomware.live) cover all attack types, ransomware or not, with victim, country and a summary in French.</p>
    <p><b>SEC Form 8-K</b> Item 1.05 / 8.01 filings are the company's own confirmation, within four business days of deciding an incident is material. US-listed companies only; the SIC code gives an authoritative industry.</p>
    <p><b>Press</b>: specialist cybersecurity outlets (EN, FR, IT, DE, ES), food and dairy trade press, and Google News searches in six languages for dairy and food incidents — the fastest route for incidents at non-listed companies.</p>
    <p><b>Government CERTs</b> (CISA, CERT-FR, NCSC) for campaigns and alerts.</p></div></div>
   <div class="card"><h3>Method and limits</h3><div class="small" style="line-height:1.6">
    <p><b>Industry</b>: from the source sector (ransomware.live, SEC SIC code), then keywords and company names in seven languages (dairy, food &amp; beverage, agriculture, packaging, cold chain, food retail, food equipment). Food banks and charities are excluded.</p>
    <p><b>Country</b>: from the source when given; otherwise from the web domain or country names in the headline, shown as “inferred”.</p>
    <p><b>Duplicates</b>: the same claim or article seen by several sources is merged and shows “+ n more”; related signals appear in the detail panel.</p>
    <p><b>Speed</b>: the pipeline runs every 10 minutes on GitHub Actions (GitHub may delay schedules at busy times); the page checks every ${C.refreshMinutes} minutes. “Detected” is when Incident Radar first saw the signal.</p>
    <p><b>ransomware.live</b>: its free public API is rate-limited and meant for personal use; for team use, register a free token at my.ransomware.live (see README).</p></div></div></div>`;
};
views.info=function(){
  $('#view').innerHTML=`<div class="grid g-2"><div class="card"><h3>Incident Radar</h3><p style="margin:6px 0 2px;font-size:15px"><b>Lactalis Enterprise Security</b></p><p style="margin:0 0 10px">Marco Alderisio</p>
    <dl><dt>Purpose</dt><dd>Be the first to know about cyber incidents that could affect the Lactalis industry, its supply chain and the countries where the Group operates.</dd>
    <dt>Copyright</dt><dd>© ${new Date().getFullYear()} Marco Alderisio. All rights reserved.</dd><dt>Version</dt><dd>0.1</dd><dt>Architecture</dt><dd>Serverless: a static page, plus a data file rebuilt by GitHub Actions. Nothing is sent anywhere; settings and send history stay in your browser.</dd>
    <dt>Data</dt><dd>${fmtN(ALL.length)} signals · built ${esc(lastBuilt?fmtDT(Date.parse(lastBuilt)):'—')} · ${SNAP()?'snapshot':'live deployment'}</dd></dl></div>
   <div class="card"><h3>Legend</h3><table class="legend-t"><tbody>
    <tr><td><span class="rb r1">CRITICAL</span></td><td>Lactalis group or watchlist mention, or dairy in our footprint</td></tr><tr><td><span class="rb r2">HIGH</span></td><td>Dairy anywhere, or our industry in our footprint</td></tr>
    <tr><td><span class="rb r3">MEDIUM</span></td><td>Our industry elsewhere, or our supply chain in our footprint</td></tr><tr><td><span class="rb r4">LOW</span></td><td>Background threat activity</td></tr>
    <tr><td><span class="newdot">NEW</span></td><td>Detected since you last pressed “Mark as read”</td></tr><tr><td><span class="tag imp">⚙ Operations impact</span></td><td>Production or operations reported disrupted</td></tr>
    <tr><td><button class="mailbtn">✉ E-mail</button></td><td>Opens the formatted notification for the mailing list</td></tr><tr><td><button class="mailbtn sent">✉ sent 23 Nov</button></td><td>Already e-mailed; clicking sends an update. ↺ resets.</td></tr>
    ${TYPES.map(t=>`<tr><td><b>${t.s}</b></td><td>${esc(t.d)}</td></tr>`).join('')}</tbody></table>
    <h3 style="margin-top:14px">Keyboard</h3><div class="small"><kbd>/</kbd> search · <kbd>↑</kbd><kbd>↓</kbd> move · <kbd>Enter</kbd> open · <kbd>Esc</kbd> close · <kbd>1</kbd><kbd>2</kbd><kbd>3</kbd> industry scope</div></div></div>`;
};

/* ---------- routing / render ---------- */
function route(){ const h=(location.hash||'#feed').slice(1); return views[h]?h:'feed'; }
function render(){
  const r=route(); document.querySelectorAll('#nav a').forEach(a=>a.classList.toggle('on',a.getAttribute('href')==='#'+r));
  $('#filters').style.display=['feed','overview','map'].includes(r)?'flex':'none';
  document.documentElement.style.setProperty('--hdr',$('#hdr').offsetHeight+'px');
  if(!ALL.length&&['feed','overview','map'].includes(r)){ $('#view').innerHTML=`<div class="empty">${loadErr?'Could not load data: '+esc(loadErr):'Loading incident data…'}</div>`; status(); return; }
  chips();
  try{ views[r](); }catch(e){ console.error(e); $('#view').innerHTML=`<div class="banner">Render error: ${esc(e.message)}</div>`; }
  status();
}
function moveCursor(d){ const n=[...document.querySelectorAll('#rows .ir')]; if(!n.length) return; let i=n.findIndex(x=>x.dataset.id===cur); i=Math.max(0,Math.min(n.length-1,i+d)); n.forEach(x=>x.classList.remove('cur')); n[i].classList.add('cur'); cur=n[i].dataset.id; n[i].scrollIntoView({block:'nearest'}); n[i].focus({preventScroll:true}); }
addEventListener('hashchange',()=>{ closeDrawer(); const mm=$('#mailModal'); mm.hidden=true; mm.innerHTML=''; limit=80; populate(); render(); scrollTo(0,0); });
let rT, lastW=innerWidth; addEventListener('resize',()=>{ if(Math.abs(innerWidth-lastW)<40) return; lastW=innerWidth; clearTimeout(rT); rT=setTimeout(render,250); });
$('#drawerX').onclick=closeDrawer;
addEventListener('keydown',e=>{ const typing=/INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName);
  if(e.key==='Escape'){ if(!$('#mailModal').hidden){ $('#mailModal').hidden=true; $('#mailModal').innerHTML=''; return; } closeDrawer(); if(typing) document.activeElement.blur(); }
  if(typing||e.metaKey||e.ctrlKey||e.altKey) return;
  if(route()==='feed'){ if(e.key==='ArrowDown'||e.key==='j'){ e.preventDefault(); moveCursor(1); return; } if(e.key==='ArrowUp'||e.key==='k'){ e.preventDefault(); moveCursor(-1); return; } }
  if(e.key==='/'){ e.preventDefault(); $('#fQ').focus(); }
  const sc={'1':'lactalis','2':'supply','3':'all'}[e.key]; if(sc){ F.scope=sc; F.ind=scopeSet(sc); saveF(); refresh(); } });
$('#btnRefresh').onclick=()=>{ load(); schedule(); };
const theme=ls.get('ir.theme',C.defaultTheme==='light'?'light':'dark'); document.documentElement.dataset.theme=theme;
$('#btnTheme').onclick=()=>{ const t=document.documentElement.dataset.theme==='light'?'dark':'light'; document.documentElement.dataset.theme=t; ls.set('ir.theme',t); };
(function logo(){ const img=$('#brandLogo'), chip=$('#logoChip'); chip.style.background=C.logoBackground||'transparent'; if(C.logo){ img.src=C.logo; chip.hidden=false; img.onerror=()=>chip.hidden=true; } })();
$('#cyear').textContent=new Date().getFullYear();
let pollT,tickT,lastRun=0;
function schedule(){ clearInterval(pollT); clearInterval(tickT); const p=Math.max(1,C.refreshMinutes)*60e3; nextAt=Date.now()+p; lastRun=Date.now();
  pollT=setInterval(()=>{ nextAt=Date.now()+p; lastRun=Date.now(); load(); },p); tickT=setInterval(status,20e3); }
document.addEventListener('visibilitychange',()=>{ if(!document.hidden&&Date.now()-lastRun>Math.max(1,C.refreshMinutes)*60e3){ load(); schedule(); } });
render(); load(true).then(schedule);

</script>
