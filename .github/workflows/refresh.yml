# Collects public cyber-incident sources every 10 minutes and publishes the normalised data
# (incidents.json, status.json) to the "data" branch. No web page is published from this repository.
name: Collect sources
on:
  schedule:
    - cron: "*/10 * * * *"     # GitHub may delay scheduled runs at busy times
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: write              # push to the data branch
concurrency:
  group: collect
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Restore history
        uses: actions/cache@v4
        with:
          path: cache
          key: ir-cache-${{ github.run_id }}
          restore-keys: ir-cache-
      - name: Collect
        env:
          IR_OUT: out
          IR_PREV: cache/incidents.json
          IR_UA: ${{ vars.IR_UA }}            # optional: "<name>/1.0 (contact: you@yourdomain)" — SEC EDGAR asks for a contact
          RL_BASE: ${{ vars.RL_BASE }}        # optional: ransomware.live API base
          RL_HEADER: ${{ secrets.RL_HEADER }} # optional: "Header-Name: token" for a ransomware.live token
        run: python3 scripts/build.py
      - name: Publish data branch
        run: |
          cd out
          git init -q -b data && git add incidents.json status.json
          git -c user.name="collector" -c user.email="actions@users.noreply.github.com" commit -q -m "data $(date -u +%FT%TZ)"
          git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" data
